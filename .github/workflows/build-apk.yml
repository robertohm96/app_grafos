name: Compilar APK Android (GraphColor Pro)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK en la Nube
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Configurar Java JDK 21 (Requerido por Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🏗️ Compilar frontend web
        run: npm run build

      - name: 🔌 Sincronizar assets con Android
        run: npx cap sync android

      - name: 🔨 Permisos para Gradle
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Subir APK a Descargas de GitHub (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GraphColor-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
